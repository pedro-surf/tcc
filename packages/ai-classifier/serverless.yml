service: ai-classifier
frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  timeout: 60
  memorySize: 512
  environment:
    CRON_SECRET: ${env:CRON_SECRET, ''}
    CLASSIFIER_SLOT: ${env:CLASSIFIER_SLOT, 'heuristic'}
    CLASSIFIER_MODEL_FORMAT: ${env:CLASSIFIER_MODEL_FORMAT, 'onnx'}
    CLASSIFIER_MODEL_PATH: ${env:CLASSIFIER_MODEL_PATH, ''}

functions:
  jobs:
    handler: src/handler.handler
    timeout: 60
    url: true
    events:
      - httpApi:
          path: /jobs/{job}
          method: POST

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    packager: pnpm
    platform: node
    target: node20
    exclude:
      - '@aws-sdk/*'
  serverless-offline:
    httpPort: 4010
    lambdaPort: 4012
    noPrependStageInUrl: true
    lambdaTimeout: 60
