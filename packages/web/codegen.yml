overwrite: true
schema: "http://localhost:3000/graphql"
documents:
  - "src/**/*.graphql"
generates:
  src/generated/graphql.tsx:
    plugins:
      - add:
          content: |
            export class TypedDocumentString<TResult, TVariables> extends String {
              __apiType?: NonNullable<TResult>;
              __variablesType?: NonNullable<TVariables>;
              __meta__?: Record<string, unknown>;
              private readonly __value: string;
              constructor(value: string, __meta__?: Record<string, unknown>) {
                super(value);
                this.__value = value;
                this.__meta__ = __meta__;
              }
              toString(): string {
                return this.__value;
              }
            }
      - typescript
      - typescript-operations
      - typescript-react-query
    config:
      fetcher: '../graphql/fetcher#fetcher'
      exposeQueryKeys: true
      exposeMutationKeys: true
      skipTypename: false
      preResolveTypes: true
      reactQueryVersion: 5
      addInfiniteQuery: false
      documentMode: string
      enumsAsConst: true
      useTypeImports: true
      pureMagicComment: true