query GetSpots($take: Int, $skip: Int, $name: String) {
  spots(take: $take, skip: $skip, name: $name) {
    id
    name
    lat
    lng
    waveType
    bottomType
    country
    locationId
    difficulty
    description
    idealWindDir
    idealSwellDir
    strongSwellTolerance
    strongWindTolerance
    secret
    mapsUrl
  }
}
