query GetOffers(
  $take: Int
  $skip: Int
  $productType: MarketplaceProductTypeEnum
  $includeConcluded: Boolean
) {
  offers(
    take: $take
    skip: $skip
    productType: $productType
    includeConcluded: $includeConcluded
  ) {
    id
    productId
    productType
    productLabel
    price
    currency
    title
    description
    active
    concludedAt
    createdAt
    user {
      id
      name
      email
      phone
      location
    }
    buyer {
      id
      name
      email
    }
    ownershipHistory {
      id
      acquiredAt
      releasedAt
      isCurrent
      user {
        id
        name
      }
      fromUser {
        id
        name
      }
    }
  }
}
