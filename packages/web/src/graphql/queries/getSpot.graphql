query GetSpot($id: ID!) {
  spot(id: $id) {
    id
    name
    description
    lat
    lng
    waveType
    bottomType
    country
    locationId
    difficulty
    idealWindDir
    idealSwellDir
    strongSwellTolerance
    strongWindTolerance
    secret
    mapsUrl
    createdAt
    media {
      id
      mediaUrl
      mediaType
      mimeType
    }
  }
}
