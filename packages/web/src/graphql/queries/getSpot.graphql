query GetSpot($id: ID!) {
  spot(id: $id) {
    id
    name
    description
    lat
    lng
    waveType
    bottomType
    country
    locationId
    difficulty
    idealWindDir
    idealSwellDir
    strongSwellTolerance
    strongWindTolerance
    weeklyGeneratedDescription
    weeklyGeneratedAt
    canGenerateWeeklyDescription
    secret
    mapsUrl
    createdAt
    media {
      id
      mediaUrl
      mediaType
      mimeType
    }
    weeklyDescriptions(take: 12) {
      id
      description
      generatedAt
      weekStart
      primaryForecastId
      primaryForecast {
        id
        timestamp
        swell
        wind
        ideal
        score
      }
    }
  }
}
