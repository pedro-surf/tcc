mutation CreateSpot($data: SpotCreateInput!) {
  createSpot(data: $data) {
    id
    name
    lat
    lng
    waveType
    bottomType
    country
    locationId
    difficulty
    description
    idealWindDir
    idealSwellDir
    strongSwellTolerance
    strongWindTolerance
    secret
    mapsUrl
    media {
      id
      mediaUrl
      mediaType
    }
  }
}
